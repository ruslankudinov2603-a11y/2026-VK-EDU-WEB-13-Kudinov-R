services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env.docker
    depends_on:
      - db
    networks:
      - asklemon-network

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: asklemon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - asklemon-network

volumes:
  postgres_data:

networks:
  asklemon-network:
    driver: bridge